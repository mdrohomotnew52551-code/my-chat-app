<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Messenger - Smooth Login</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        
        /* Auth Screen */
        #auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: white; }
        .logo-box { text-align: center; margin-bottom: 30px; }
        .logo-box h2 { color: #4fae61; margin-top: 10px; }
        .input-group { width: 100%; max-width: 350px; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .auth-btn { width: 100%; max-width: 350px; padding: 12px; background: #0084ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Main App Interface */
        #app-container { display: none; height: 100vh; flex-direction: column; }
        .navbar { background: #4fae61; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .logout-btn { background: #ff3b30; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }

        /* User List Screen */
        #user-screen { flex: 1; display: flex; flex-direction: column; background: white; }
        .screen-title { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #ddd; font-size: 16px; color: #555; }
        .user-list { list-style: none; overflow-y: auto; flex: 1; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; transition: 0.2s; }
        .user-item:hover { background: #f0f2f5; }
        .user-avatar { width: 45px; height: 45px; background: #0084ff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; font-size: 18px; }

        /* Chat Screen */
        #chat-screen { flex: 1; display: none; flex-direction: column; background: #efeae2; }
        .chat-header { background: #4fae61; color: white; padding: 12px; display: flex; align-items: center; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; margin-right: 15px; cursor: pointer; font-weight: bold; }
        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        
        /* Message Bubbles */
        .msg { max-width: 75%; padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; font-size: 15px; word-wrap: break-word; line-height: 1.4; }
        .msg.sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg.received { background: white; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }

        /* Input Area */
        .input-area { background: #f0f2f5; padding: 10px; display: flex; align-items: center; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 12px; border: none; border-radius: 20px; background: white; font-size: 15px; outline: none; padding-left: 15px; }
        .send-btn { background: #4fae61; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; margin-left: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="logo-box">
            <h2>Life Messenger</h2>
            <p style="margin-top: 5px; color: #666;">মোবাইল নাম্বার দিয়ে লগইন করুন</p>
        </div>
        
        <div id="phone-input-sec" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="input-group">
                <input type="text" id="user-profile-name" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="input-group">
                <input type="text" id="phone-number" placeholder="কোডসহ নাম্বার দিন (যেমন: +88017XXXXXXXX)">
            </div>
            
            <div id="invisible-recaptcha"></div>
            
            <button class="auth-btn" id="send-otp-btn" onclick="sendOTPCode()">ওটিপি (OTP) পাঠান</button>
        </div>

        <div id="otp-input-sec" style="width: 100%; display: none; flex-direction: column; align-items: center;">
            <div class="input-group">
                <input type="text" id="otp-code" placeholder="৬ ডিজিটের ওটিপি কোড দিন">
            </div>
            <button class="auth-btn" style="background: #4fae61;" onclick="verifyOTPCode()">ভেরিফাই ও লগইন</button>
        </div>
    </div>

    <div id="app-container">
        <div class="navbar">
            <span id="user-display-name">Life Messenger</span>
            <button class="logout-btn" onclick="logout()">লগআউট</button>
        </div>

        <div id="user-screen">
            <div class="screen-title">যার সাথে কথা বলতে চান তার মোবাইল নাম্বারের ওপর ক্লিক করুন:</div>
            <ul class="user-list" id="users-list-ui"></ul>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <button class="back-btn" onclick="backToUserList()">←</button>
                <span id="chatting-with-name" style="font-weight: bold; font-size: 17px;">ইউজার</span>
            </div>
            <div class="messages-container" id="messages-box"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="মেসেজ লিখুন...">
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbpbflrMUXoFjhUC37kYSzO3hoy5G9o58",
            authDomain: "eibrahim-a67a6.firebaseapp.com",
            databaseURL: "https://eibrahim-a67a6-default-rtdb.firebaseio.com",
            projectId: "eibrahim-a67a6",
            storageBucket: "eibrahim-a67a6.firebasestorage.app",
            messagingSenderId: "519997364197",
            appId: "1:519997364197:web:b7e522546acfe9207e410c",
            measurementId: "G-38KBHKB8WT"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let activeChatUserId = null;
        let chatRef = null;
        let confirmationResultObj = null;

        // ছবি মেলানোর ঝামেলা বন্ধ করতে অদৃশ্য (Invisible) রিক্যাপচা সেটআপ
        window.onload = function() {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('invisible-recaptcha', {
                'size': 'invisible',
                'callback': function(response) {
                    // ব্যাকগ্রাউন্ডে ভেরিফাই হলে স্বয়ংক্রিয় কাজ করবে
                }
            });
        };

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                
                let savedName = localStorage.getItem('temp_name') || user.phoneNumber;
                document.getElementById('user-display-name').innerText = savedName;
                
                database.ref('users/' + user.uid).set({
                    uid: user.uid,
                    name: savedName,
                    phone: user.phoneNumber
                });

                loadUserList();
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        function sendOTPCode() {
            const name = document.getElementById('user-profile-name').value.trim();
            const phone = document.getElementById('phone-number').value.trim();

            if (!name || !phone) {
                alert("দয়া করে নাম এবং দেশের কোডসহ মোবাইল নাম্বার দিন ভাই।");
                return;
            }

            localStorage.setItem('temp_name', name);
            const appVerifier = window.recaptchaVerifier;

            const btn = document.getElementById('send-otp-btn');
            btn.innerText = "অপেক্ষা করুন...";
            btn.disabled = true;

            auth.signInWithPhoneNumber(phone, appVerifier)
                .then((confirmationResult) => {
                    confirmationResultObj = confirmationResult;
                    document.getElementById('phone-input-sec').style.display = 'none';
                    document.getElementById('otp-input-sec').style.display = 'flex';
                    alert("আপনার মোবাইলে ওটিপি কোড পাঠানো হয়েছে ভাই।");
                }).catch((error) => {
                    alert("কোড পাঠানো যায়নি: " + error.message);
                    btn.innerText = "ওটিপি (OTP) পাঠান";
                    btn.disabled = false;
                    // কোনো কারণে ফেইল হলে রিক্যাপচা রিসেট করা
                    window.recaptchaVerifier.render().then(function(widgetId) {
                        grecaptcha.reset(widgetId);
                    });
                });
        }

        function verifyOTPCode() {
            const code = document.getElementById('otp-code').value.trim();
            if (!code) { alert("কোডটি সঠিকভাবে লিখুন ভাই।"); return; }

            confirmationResultObj.confirm(code).then((result) => {
                // সফল লগইন
            }).catch((error) => {
                alert("ভুল ওটিপি কোড! আবার চেষ্টা করুন।");
            });
        }

        function loadUserList() {
            database.ref('users').on('value', snapshot => {
                const usersListUI = document.getElementById('users-list-ui');
                usersListUI.innerHTML = '';
                snapshot.forEach(childSnapshot => {
                    const userData = childSnapshot.val();
                    if (userData.uid !== currentUser.uid) {
                        const li = document.createElement('li');
                        li.className = 'user-item';
                        li.onclick = () => openChatBox(userData.uid, userData.name);
                        
                        const firstLetter = userData.name.charAt(0).toUpperCase();
                        li.innerHTML = `
                            <div class="user-avatar">${firstLetter}</div>
                            <div>
                                <div style="font-weight: bold; font-size: 16px; color: #333;">${userData.name}</div>
                                <div style="font-size: 12px; color: #777;">${userData.phone}</div>
                            </div>
                        `;
                        usersListUI.appendChild(li);
                    }
                });
            });
        }

        function openChatBox(targetUid, targetName) {
            activeChatUserId = targetUid;
            document.getElementById('user-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('chatting-with-name').innerText = targetName;
            
            const chatRoomId = currentUser.uid < targetUid ? currentUser.uid + "_" + targetUid : targetUid + "_" + currentUser.uid;
            
            if (chatRef) chatRef.off();
            document.getElementById('messages-box').innerHTML = '';
            chatRef = database.ref('messages/' + chatRoomId);
            
            chatRef.on('child_added', snapshot => {
                const messageData = snapshot.val();
                const messagesBox = document.getElementById('messages-box');
                const msgDiv = document.createElement('div');
                
                msgDiv.className = (messageData.senderId === currentUser.uid) ? 'msg sent' : 'msg received';
                msgDiv.innerText = messageData.text;
                messagesBox.appendChild(msgDiv);
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const messageText = input.value.trim();
            if (!messageText || !activeChatUserId) return;

            const chatRoomId = currentUser.uid < activeChatUserId ? currentUser.uid + "_" + activeChatUserId : activeChatUserId + "_" + currentUser.uid;
            
            database.ref('messages/' + chatRoomId).push({
                senderId: currentUser.uid,
                receiverId: activeChatUserId,
                text: messageText,
                timestamp: Date.now()
            });

            input.value = '';
        }

        function backToUserList() {
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('user-screen').style.display = 'flex';
            if (chatRef) chatRef.off();
        }

        function logout() {
            auth.signOut();
            localStorage.removeItem('temp_name');
        }
    </script>
</body>
</html>

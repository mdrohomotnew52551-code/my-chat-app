<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Messenger</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; height: 100vh; display: flex; flex-direction: column; }
        
        /* Login Screen */
        #auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: #ffffff; }
        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-area h2 { color: #00a884; font-size: 28px; }
        .logo-area p { color: #666; font-size: 14px; margin-top: 5px; }
        .input-box { width: 100%; max-width: 340px; margin-bottom: 15px; }
        .input-box input { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 20px; font-size: 16px; outline: none; }
        .btn-action { width: 100%; max-width: 340px; padding: 12px; background: #00a884; color: white; border: none; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-action:disabled { background: #cccccc; cursor: not-allowed; }
        
        /* Chat Main Screen */
        #app-container { display: none; height: 100vh; flex-direction: column; }
        .top-bar { background: #00a884; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .btn-logout { background: #d93025; color: white; border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer; font-size: 13px; }

        /* User List */
        #user-list-screen { flex: 1; display: flex; flex-direction: column; background: white; }
        .list-header { padding: 12px 15px; background: #f0f2f5; font-size: 14px; color: #555; font-weight: bold; }
        .users-holder { list-style: none; overflow-y: auto; flex: 1; }
        .user-card { padding: 15px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; cursor: pointer; }
        .user-card:hover { background: #f9f9f9; }
        .avatar { width: 45px; height: 45px; background: #00a884; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; font-size: 18px; }

        /* Personal Chat Screen */
        #chat-screen { flex: 1; display: none; flex-direction: column; background: #efeae2; }
        .chat-header { background: #00a884; color: white; padding: 12px 15px; display: flex; align-items: center; }
        .btn-back { background: none; border: none; color: white; font-size: 22px; margin-right: 15px; cursor: pointer; }
        .msg-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        
        /* Message Bubbles */
        .bubble { max-width: 75%; padding: 8px 14px; margin-bottom: 5px; border-radius: 8px; font-size: 15px; word-wrap: break-word; }
        .bubble.me { background: #d9fdd3; align-self: flex-end; }
        .bubble.other { background: #ffffff; align-self: flex-start; border: 1px solid #e1e1e1; }

        /* Type Area */
        .type-area { background: #f0f2f5; padding: 10px; display: flex; align-items: center; }
        .type-area input { flex: 1; padding: 12px; border: none; border-radius: 25px; background: white; font-size: 15px; outline: none; padding-left: 15px; }
        .btn-send { background: #00a884; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; margin-left: 10px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="logo-area">
            <h2>Life Messenger</h2>
            <p>আপনার অ্যাকাউন্ট ভেরিফাই করুন</p>
        </div>
        
        <div id="step-phone" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="input-box">
                <input type="text" id="input-name" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="input-box">
                <input type="text" id="input-phone" placeholder="যেমন: +88017XXXXXXXX">
            </div>
            
            <div id="recaptcha-invisible-box"></div>
            
            <button class="btn-action" id="btn-send-otp" onclick="startOTPProcess()">ওটিপি (OTP) পাঠান</button>
        </div>

        <div id="step-otp" style="width: 100%; display: none; flex-direction: column; align-items: center;">
            <div class="input-box">
                <input type="text" id="input-otp" placeholder="৬ ডিজিটের কোডটি দিন">
            </div>
            <button class="btn-action" style="background: #00a884;" onclick="checkOTPProcess()">ভেরিফাই করুন</button>
        </div>
    </div>

    <div id="app-container">
        <div class="top-bar">
            <span id="my-profile-name">Life Messenger</span>
            <button class="btn-logout" onclick="userLogout()">লগআউট</button>
        </div>

        <div id="user-list-screen">
            <div class="list-header">সবাইকে মেসেজ করুন:</div>
            <ul class="users-holder" id="ui-users-list"></ul>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <button class="btn-back" onclick="closeChatBox()">←</button>
                <span id="chat-user-title" style="font-weight: bold;">ইউজার</span>
            </div>
            <div class="msg-area" id="ui-msg-box"></div>
            <div class="type-area">
                <input type="text" id="msg-text-input" placeholder="মেসেজ লিখুন...">
                <button class="btn-send" onclick="hitSendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        // আপনার সঠিক ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDbpbflrMUXoFjhUC37kYSzO3hoy5G9o58",
            authDomain: "eibrahim-a67a6.firebaseapp.com",
            databaseURL: "https://eibrahim-a67a6-default-rtdb.firebaseio.com",
            projectId: "eibrahim-a67a6",
            storageBucket: "eibrahim-a67a6.firebasestorage.app",
            messagingSenderId: "519997364197",
            appId: "1:519997364197:web:b7e522546acfe9207e410c",
            measurementId: "G-38KBHKB8WT"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let activeUserObj = null;
        let selectedChatId = null;
        let currentChatDatabaseRef = null;
        let firebaseConfirmationHolder = null;

        // অদৃশ্য ভেরিফায়ার সেটআপ (এটি স্ক্রিনে বাসের ছবি বা ক্যাপচা উইন্ডো আনা বন্ধ করবে)
        window.onload = function() {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-invisible-box', {
                'size': 'invisible',
                'callback': function(response) {
                    // অটো ভেরিফাইড
                }
            });
        };

        auth.onAuthStateChanged(user => {
            if (user) {
                activeUserObj = user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                
                let profileName = localStorage.getItem('local_name') || user.phoneNumber;
                document.getElementById('my-profile-name').innerText = profileName;
                
                database.ref('users/' + user.uid).set({
                    uid: user.uid,
                    name: profileName,
                    phone: user.phoneNumber
                });

                fetchRegisteredUsers();
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        function startOTPProcess() {
            const userName = document.getElementById('input-name').value.trim();
            const userPhone = document.getElementById('input-phone').value.trim();

            if (!userName || !userPhone) {
                alert("দয়া করে আপনার নাম এবং কোডসহ মোবাইল নাম্বার দিন ভাই।");
                return;
            }

            localStorage.setItem('local_name', userName);
            const hiddenVerifier = window.recaptchaVerifier;

            const sendBtn = document.getElementById('btn-send-otp');
            sendBtn.innerText = "কোড পাঠানো হচ্ছে...";
            sendBtn.disabled = true;

            auth.signInWithPhoneNumber(userPhone, hiddenVerifier)
                .then((confirmationResult) => {
                    firebaseConfirmationHolder = confirmationResult;
                    document.getElementById('step-phone').style.display = 'none';
                    document.getElementById('step-otp').style.display = 'flex';
                    alert("আপনার সিমের নাম্বারে ওটিপি পাঠানো হয়েছে ভাই।");
                }).catch((err) => {
                    alert("সমস্যা হয়েছে: " + err.message);
                    sendBtn.innerText = "ওটিপি (OTP) পাঠান";
                    sendBtn.disabled = false;
                    window.recaptchaVerifier.render().then(function(widgetId) {
                        grecaptcha.reset(widgetId);
                    });
                });
        }

        function checkOTPProcess() {
            const codeInput = document.getElementById('input-otp').value.trim();
            if (!codeInput) { alert("৬ ডিজিটের কোডটি লিখুন।"); return; }

            firebaseConfirmationHolder.confirm(codeInput).then((res) => {
                // সফল লগইন স্বয়ংক্রিয় হ্যান্ডেল হবে
            }).catch((err) => {
                alert("ভুল কোড! দয়া করে সঠিক কোডটি দিন ভাই।");
            });
        }

        function fetchRegisteredUsers() {
            database.ref('users').on('value', snap => {
                const holderUI = document.getElementById('ui-users-list');
                holderUI.innerHTML = '';
                snap.forEach(child => {
                    const data = child.val();
                    if (data.uid !== activeUserObj.uid) {
                        const liRow = document.createElement('li');
                        liRow.className = 'user-card';
                        liRow.onclick = () => launchChatBox(data.uid, data.name);
                        
                        const letter = data.name.charAt(0).toUpperCase();
                        liRow.innerHTML = `
                            <div class="avatar">${letter}</div>
                            <div>
                                <div style="font-weight: bold; font-size: 16px; color: #222;">${data.name}</div>
                                <div style="font-size: 12px; color: #666; margin-top: 2px;">${data.phone}</div>
                            </div>
                        `;
                        holderUI.appendChild(liRow);
                    }
                });
            });
        }

        function launchChatBox(partnerUid, partnerName) {
            selectedChatId = partnerUid;
            document.getElementById('user-list-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('chat-user-title').innerText = partnerName;
            
            const combinedRoomId = activeUserObj.uid < partnerUid ? activeUserObj.uid + "_" + partnerUid : partnerUid + "_" + activeUserObj.uid;
            
            if (currentChatDatabaseRef) currentChatDatabaseRef.off();
            document.getElementById('ui-msg-box').innerHTML = '';
            currentChatDatabaseRef = database.ref('messages/' + combinedRoomId);
            
            currentChatDatabaseRef.on('child_added', snap => {
                const msgObj = snap.val();
                const uiBox = document.getElementById('ui-msg-box');
                const element = document.createElement('div');
                
                element.className = (msgObj.senderId === activeUserObj.uid) ? 'bubble me' : 'bubble other';
                element.innerText = msgObj.text;
                uiBox.appendChild(element);
                uiBox.scrollTop = uiBox.scrollHeight;
            });
        }

        function hitSendMessage() {
            const textNode = document.getElementById('msg-text-input');
            const mainText = textNode.value.trim();
            if (!mainText || !selectedChatId) return;

            const combinedRoomId = activeUserObj.uid < selectedChatId ? activeUserObj.uid + "_" + selectedChatId : selectedChatId + "_" + activeUserObj.uid;
            
            database.ref('messages/' + combinedRoomId).push({
                senderId: activeUserObj.uid,
                receiverId: selectedChatId,
                text: mainText,
                timestamp: Date.now()
            });

            textNode.value = '';
        }

        function closeChatBox() {
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('user-list-screen').style.display = 'flex';
            if (currentChatDatabaseRef) currentChatDatabaseRef.off();
        }

        function userLogout() {
            auth.signOut();
            localStorage.removeItem('local_name');
        }
    </script>
</body>
</html>
